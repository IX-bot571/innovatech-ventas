name: 🚀 Pipeline CI/CD - Backend Ventas

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout del código
      uses: actions/checkout@v4

    - name: 🛠️ Configurar Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: 🔐 Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 📦 Construir y Publicar imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-back-ventas:latest

    - name: 🌐 Desplegar actualización en AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "🤖 Conectado a AWS EC2. Desplegando Back Ventas..."
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-back-ventas:latest
          docker stop innovatech-back-ventas || true
          docker rm innovatech-back-ventas || true
          docker run -d --name innovatech-back-ventas -p 8081:8081 ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-back-ventas:latest
          echo "✨ Backend Ventas actualizado con éxito!"
